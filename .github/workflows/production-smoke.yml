name: Production smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate deployment URL
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: |
          if [ -z "$APP_BASE_URL" ]; then
            echo "::error::Set repository variable APP_BASE_URL to the deployed HTTPS origin."
            exit 1
          fi
          case "$APP_BASE_URL" in
            https://*) ;;
            *) echo "::error::APP_BASE_URL must use HTTPS."; exit 1 ;;
          esac
          echo "APP_BASE_URL=${APP_BASE_URL%/}" >> "$GITHUB_ENV"
      - name: Check app health endpoint
        run: |
          response="$(curl --fail-with-body --silent --show-error --retry 2 --retry-delay 2 "$APP_BASE_URL/api/health")"
          echo "$response"
          printf '%s' "$response" | node -e '
            let body = "";
            process.stdin.on("data", chunk => body += chunk);
            process.stdin.on("end", () => {
              const value = JSON.parse(body);
              if (value.status !== "ok" || value.service !== "assistant") process.exit(1);
            });
          '
      - name: Check sign-in page is publicly reachable
        run: |
          html="$(curl --fail-with-body --silent --show-error --location "$APP_BASE_URL/auth")"
          printf '%s' "$html" | grep -qi "Welcome back"
          printf '%s' "$html" | grep -qi "Continue with Google"
